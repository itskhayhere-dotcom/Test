try{const s=await window.claude?.use('sample');if(!s)throw 0;const r=await s('Read this supplier bill. Reply with ONLY JSON: {"supplier":"","date":"YYYY-MM-DD","billNo":"","items":[{"name":"","qty":0,"rate":0}],"total":0}. Use numbers for qty, rate and total in the bill currency.',{images:[file],modelTier:'quick'});
const j=JSON.parse(r.text.match(/\{[\s\S]*\}/)[0]);if(j.supplier)f.sup.value=j.supplier;if(/^\d{4}-\d\d-\d\d$/.test(j.date||''))f.d.value=j.date;if(j.billNo)f.bn.value=j.billNo;
if(j.items&&j.items.length){items=j.items.map(r=>({name:String(r.name||''),qty:+r.qty||1,rate:+r.rate||0}));rend()}f.amt.value=+j.total||+tot().toFixed(3);st.textContent='Bill read. Please check the items and total before saving.'}
catch(err){st.textContent='This bill could not be read automatically. Please enter the items by hand.'}};
f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(i.purch.some(r=>r.sup===d.sup&&r.bn===d.bn)){$('#bs').textContent='A purchase with this supplier and bill number is already recorded.';return}i.purch.push({d:d.d,sup:d.sup,bn:d.bn,amt:+d.amt,items:items.filter(r=>r.name)});hide();draw()}}
function pdet(i,x){const r=i.purch[x],t=r.items.reduce((s,a)=>s+a.qty*a.rate,0);
show(`<div class="box wide"><h3>${esc(r.sup)} · bill ${esc(r.bn)}</h3><p class="mut">Dated ${r.d}</p>${tbl('<th>Item</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">Amount</th>',r.items.map(a=>`<tr><td>${esc(a.name)}</td><td class="n">${a.qty}</td><td class="n">${fmt(a.rate)}</td><td class="n">${fmt(a.qty*a.rate)}</td></tr>`),`<tfoot><tr><td colspan="3">Items total</td><td class="n">${fmt(t)}</td></tr><tr><td colspan="3">Bill total</td><td class="n">${fmt(r.amt)}</td></tr></tfoot>`)}<div class="row end"><button class="d" id="pdl">Delete purchase</button><button class="g" data-close>Close</button></div></div>`);
$('#pdl').onclick=()=>{i.purch.splice(x,1);hide();draw()}}

document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.f;if(!k)return;e.preventDefault();const i=get(open),d=Object.fromEntries(new FormData(f));
if(dupe(i,k,d)){flash('This entry is already recorded.');return}
if(k==='income')i.income.push({d:d.d,a:d.a,amt:+d.amt});
if(k==='exp'){const nc=(d.newcat||'').trim();if(nc&&!S.cats.includes(nc))S.cats.push(nc);i.exp.push({d:d.d,cat:nc||d.cat,a:d.a,who:(d.who||'').trim(),amt:+d.amt})}
if(k==='wday')i.labour[wk].days.push({d:d.d,ot:+d.ot||0,note:d.note});
if(k==='wpay')i.labour[wk].pays.push({d:d.d,amt:+d.amt,note:d.note});draw()});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(a==='prog'){get(t.dataset.id).progress=+t.value;draw()}if(a==='ewho'){ef.who=t.value;draw()}});
document.addEventListener('input',e=>{if(e.target.dataset.a==='prog')e.target.previousSibling.nodeValue='Work completed: '});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||['SELECT','INPUT'].includes(b.tagName))return;const a=b.dataset.a,i=get(b.dataset.id||open),x=+b.dataset.x;
if(a==='nav'){fv=null;view=b.dataset.k;open=null;draw()}
else if(a==='open'){open=i.id;ltab='income';wk=null;draw()}
else if(a==='back'){open=null;draw()}
else if(a==='lt'){ltab=b.dataset.k;draw()}
else if(a==='del'){i[b.dataset.k].splice(x,1);draw()}
else if(a==='ecat'){ef.cat=b.dataset.k;draw()}
else if(a==='addp')purchModal(i)
else if(a==='pdet')pdet(i,x)
else if(a==='wopen'){wk=x;draw()}
else if(a==='wback'){wk=null;draw()}
else if(a==='wdel'){i.labour[wk][b.dataset.t].splice(x,1);draw()}
else if(a==='addw')modal('Add worker',`<label>Name<input name="name" required></label><label>Trade<input name="trade" required placeholder="For example: Carpenter, Electrician"></label><div class="two"><label>Fixed wage per day (OMR)<input name="wage" type="number" min="0" step="any" required></label><label>Overtime rate per hour (OMR)<input name="ot" type="number" min="0" step="any" value="0"></label></div>`,'Save worker',d=>{i.labour.push({name:d.name,trade:d.trade,wage:+d.wage,otRate:+d.ot||0,days:[],pays:[]})})
else if(a==='toquote'){(i.elog=i.elog||[]).push({at:Date.now(),by:who(),text:'Moved to quotation'});i.stage='quote';i.quote={by:'',email:'',cp:i.cp,status:QS[0],vers:[{v:1,amt:i.value,date:today()}]};draw()}
else if(a==='editq'){const q=i.quote;modal('Quotation details · '+esc(i.client),`<label>Prepared by<input name="by" value="${esc(q.by)}" required></label><div class="two"><label>Sent to (contact person)<input name="cp" value="${esc(q.cp)}" required></label><label>Email shared with<input name="email" type="email" value="${esc(q.email)}" required></label></div><div class="two"><label>Status${sel('status',QS,q.status)}</label><label>Amount for v${cur(q).v} (OMR)<input name="amt" type="number" min="0" step="any" value="${cur(q).amt}" required></label></div>`,'Save details',d=>{Object.assign(q,{by:d.by,cp:d.cp,email:d.email,status:d.status});cur(q).amt=+d.amt;i.value=+d.amt})}
else if(a==='newver'){const q=i.quote,c=cur(q);q.vers.push({v:c.v+1,amt:c.amt,date:today()});q.status='Revised quotation sent';draw()}
else if(a==='approve')modal('Approve quotation',`<p><b>${esc(i.client)}</b> · version v${cur(i.quote).v}<br>Approved amount: <b>${fmt(cur(i.quote).amt)}</b></p><p class="mut">The project moves to Ongoing, where you can record income, purchases, labour and expenses.</p>`,'Approve and start work',()=>{i.stage='ongoing';i.value=cur(i.quote).amt;i.progress=0;i.startedOn=today();Object.assign(i,{income:[],purch:[],labour:[],exp:[]});view='ongoing';open=i.id;ltab='income'})
else if(a==='cancel'){const from=i.stage==='quote'?'Quotation':'Enquiry';modal(i.stage==='quote'?'Reject quotation':'Cancel enquiry',`<label>Reason<textarea name="r" rows="3" required placeholder="For example: client went with another vendor"></textarea></label>`,'Move to cancelled',d=>{(i.elog=i.elog||[]).push({at:Date.now(),by:who(),text:(from==='Quotation'?'Quotation rejected: ':'Enquiry cancelled: ')+d.r});i.stage='cancelled';i.reason=d.r;i.from=from;view='cancelled'})}
else if(a==='reopen'){i.stage='enquiry';i.reason='';view='enquiry';draw()}
else if(a==='new')modal('New enquiry',`<label>Company<input name="client" required></label><div class="two"><label>Contact person<input name="cp" required></label><label>Phone<input name="phone" required placeholder="+968"></label></div><label>Email address<input name="email" type="email" placeholder="name@company.com"></label><div class="two"><label>Division${sel('div',DIVS)}</label><label>Location<input name="loc" required placeholder="For example: Muscat"></label></div><label>What does the client need?<textarea name="desc" rows="3" required></textarea></label><label>Estimated value (OMR)<input name="value" type="number" min="0" step="any" value="0"></label><div class="two"><label>Handled by<input name="handler" value="${esc(ME&&ME.name||'')}" required></label><label>Assigned by<input name="assigner" placeholder="Who assigned this enquiry"></label></div><div class="two"><label>How did they find us?${sel('source',SOURCES)}</label><label>Reference name (if referred)<input name="refName" placeholder="Leave blank if none"></label></div>`,'Save enquiry',d=>{S.items.push({id:Date.now(),client:d.client,cp:d.cp,phone:d.phone,div:d.div,loc:d.loc,desc:d.desc,value:+d.value||0,email:(d.email||'').trim(),handler:d.handler,assigner:d.assigner,source:d.source,refName:(d.refName||'').trim(),stage:'enquiry',date:today(),acts:[{at:Date.now(),by:who(),medium:'System',status:'Enquiry created',resp:'',ours:''}]});view='enquiry'})
});
setInterval(refresh,60000);initPresence();let lq=0;new MutationObserver(()=>{cancelAnimationFrame(lq);lq=requestAnimationFrame(labels)}).observe(document.body,{childList:true,subtree:true});
function labels(){document.querySelectorAll('td').forEach(td=>{if(/^Day total/.test(td.textContent))td.parentNode.classList.add('sub')});document.querySelectorAll('input[data-part]').forEach(c=>{c.indeterminate=c.dataset.part==='1'});document.querySelectorAll('table').forEach(t=>{const hs=[...t.querySelectorAll('tr:first-child th')].map(h=>h.textContent.trim());if(!hs.length)return;t.querySelectorAll('tr').forEach(r=>{if(r.querySelector('th'))return;const f=r.parentNode.tagName==='TFOOT';[...r.children].forEach((c,k)=>{if(!c.hasAttribute('data-label'))c.setAttribute('data-label',f?'':(hs[k]||''))})})})}
draw();
</script></body></html>
